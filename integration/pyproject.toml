[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongchangjin-integrated-agent"
version = "0.1.0"
description = "Contract-first integration harness for Hands-on 01-09."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
integrated-agent = "integrated_agent.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
