[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongchangjin-cybersecurity-agent"
version = "0.1.0"
description = "Container-isolated deterministic security verification for Hands-on 09."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
cybersecurity-agent = "cybersecurity_agent.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
