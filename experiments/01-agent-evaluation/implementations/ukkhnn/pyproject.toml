[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongchangjin-agent-evaluation"
version = "0.1.0"
description = "Agent observability and evaluation hands-on with Arize Phoenix."
requires-python = ">=3.11"
dependencies = [
  "arize-phoenix-client>=2.8.0",
  "arize-phoenix-evals>=3.3.0",
  "arize-phoenix-otel>=0.14.0",
  "openai-agents>=0.2.6",
  "openinference-instrumentation-openai-agents>=1.6.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
