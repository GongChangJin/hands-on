[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongchangjin-agent-evaluation"
version = "0.1.0"
description = "A small, deterministic agent evaluation runner for hands-on learning."
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
