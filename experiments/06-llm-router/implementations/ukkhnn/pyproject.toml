[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gongchangjin-llm-router"
version = "0.1.0"
description = "Policy-driven hybrid LLM and specialist-agent router for Hands-on 06."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
llm-router = "llm_router.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
